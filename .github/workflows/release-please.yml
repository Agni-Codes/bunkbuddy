name: Prepare milestone release
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Milestone version (for example 0.1.0). Run after its acceptance checks pass."
        required: true
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: simple
          release-as: ${{ inputs.version }}
          target-branch: main
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
